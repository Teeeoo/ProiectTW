<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Login Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/login_style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-image">
            <img src="../MEDIA/login_image.jpg" alt="Anime Girl Login">
        </div>
        <div class="separator"></div>
        <div class="login-form">    
            <h2>Bine ai venit! ✨</h2>
            <input type="email" placeholder="Email-ul tău">
            <input type="password" placeholder="Parola ta secretă">
            <button>Intră în cont</button>
            <p class="register-text">
                Nu ai cont? <a href="#">Creează unul!</a>
            </p>
        </div>
    </div>
</body>
</html>
